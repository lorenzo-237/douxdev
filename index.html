<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le dev doux — liens</title>
<meta name="theme-color" content="#FF8FA6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

<script>
/* ==========================================================
   ✦ À MODIFIER ICI ✦  (tout le reste se met à jour tout seul)
   ========================================================== */
const CONFIG = {
  nom: "Le dev doux",
  accroche: "Petites applis faites maison,\nservies avec douceur.",

  // Parfum affiché à la première visite : "fraise" ou "vanille"
  parfumParDefaut: "fraise",

  // Une photo par parfum (chemin relatif à ce fichier, ou une URL).
  // Si la photo est introuvable, un petit cornet s'affiche à la place.
  photos: {
    fraise:  { src: "photos/fraise.jpg",  alt: "Ma photo, version fraise" },
    vanille: { src: "photos/vanille.jpg", alt: "Ma photo, version vanille" }
  },

  // Tes liens, dans l'ordre. Les numéros N°01, N°02… sont automatiques.
  // Laisse url vide ("") pour une carte « bientôt » en pointillés.
  liens: [
    { titre: "Whiteboard",           description: "Suivre tes séances de sport",    url: "https://wb.douxdev.fr?ref=liens" },
    { titre: "La carte des parfums", description: "Tout le glacier sur douxdev.fr", url: "portfolio.html" },
    { titre: "GitHub",               description: "Le code, côté cuisine",          url: "https://github.com/lorenzo-237" },
    { titre: "Un petit mot ?",       description: "Idées, questions ou bugs",       url: "mailto:lorenzo.softdev@gmail.com" },
    { titre: "Parfum surprise",      description: "Encore au congélateur…",         url: "" }
  ]
};
/* ========================================================== */
</script>

<style>
/* ---------- Couleurs des parfums ---------- */
body[data-parfum="fraise"] {
  --fond: #FFF1EE;  --carte: #FFFFFF;  --encre: #4A2230;
  --accent: #FF8FA6; --sur-accent: #4A2230; --doux: #FFD9E0;
}
body[data-parfum="vanille"] {
  --fond: #FFF8E6;  --carte: #FFFFFF;  --encre: #3D2B12;
  --accent: #F4C95D; --sur-accent: #3D2B12; --doux: #FCEBC0;
}

/* ---------- Base ---------- */
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  background: var(--fond); color: var(--encre);
  font-family: "Nunito", system-ui, sans-serif;
  transition: background-color .5s ease, color .5s ease;
}
.titre-font { font-family: "Fredoka", "Nunito", sans-serif; font-weight: 600; }

/* ---------- Bandeau qui défile ---------- */
.bandeau {
  background: var(--accent); color: var(--sur-accent);
  height: 36px; overflow: hidden; display: flex; align-items: center;
  font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 2px;
  transition: background-color .5s ease;
}
.defile { display: flex; white-space: nowrap; animation: defile 22s linear infinite; }
.defile span { padding-right: 12px; }
@keyframes defile { to { transform: translateX(-50%); } }

/* ---------- Page ---------- */
main {
  max-width: 440px; margin: 0 auto; padding: 24px 22px 32px;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
}

/* ---------- Le switch boule de glace ---------- */
.switch {
  position: relative; width: 132px; height: 48px; padding: 0;
  border: 2px solid var(--encre); border-radius: 999px;
  background: var(--carte); color: var(--encre); cursor: pointer;
  box-shadow: 3px 3px 0 var(--encre);
  font: 600 12px "Fredoka", sans-serif; letter-spacing: 1px;
  display: grid; grid-template-columns: 1fr 1fr; align-items: center;
}
.switch:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.switch .label { position: relative; z-index: 1; text-align: center; transition: opacity .3s; }
.boule {
  position: absolute; top: 4px; left: 4px; width: 58px; height: 36px;
  border-radius: 999px; background: var(--accent);
  transition: transform .55s cubic-bezier(.68,-0.55,.27,1.55), background-color .5s;
}
body[data-parfum="vanille"] .boule { transform: translateX(66px); }
.switch .pepites { position: absolute; inset: 0; pointer-events: none; }
.pepite {
  position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; border-radius: 3px;
  animation: pepite .7s ease-out forwards;
}
@keyframes pepite {
  from { transform: translate(-50%,-50%) rotate(0); opacity: 1; }
  to   { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--r)); opacity: 0; }
}

/* ---------- Photo qui se retourne ---------- */
.avatar { width: 112px; height: 112px; perspective: 600px; }
.avatar-inner {
  position: relative; width: 100%; height: 100%;
  transform-style: preserve-3d; transition: transform .7s cubic-bezier(.5,1.6,.5,1);
}
body[data-parfum="vanille"] .avatar-inner { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
  border: 2px solid var(--encre); background: var(--doux);
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  display: flex; align-items: center; justify-content: center;
}
.face.dos { transform: rotateY(180deg); }
.face img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

/* ---------- Textes ---------- */
h1 { margin: 0; font-size: 34px; line-height: 1.1; }
.accroche { margin: 0; font-size: 15px; text-align: center; line-height: 1.4; white-space: pre-line; opacity: .85; }
.pastille {
  border: 2px dashed var(--encre); border-radius: 999px; padding: 6px 14px;
  font: 500 12px "Fredoka", sans-serif; letter-spacing: 1.5px;
}

/* ---------- Liens ---------- */
nav { width: 100%; display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }
.lien {
  display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 12px 16px;
  background: var(--carte); color: var(--encre); text-decoration: none;
  border: 2px solid var(--encre); border-radius: 18px; box-shadow: 4px 4px 0 var(--encre);
  transition: transform .15s ease, box-shadow .15s ease, background-color .5s;
}
a.lien:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--encre); }
a.lien:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--encre); }
a.lien:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.lien.bientot { background: transparent; border-style: dashed; box-shadow: none; opacity: .75; }
.num {
  flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%;
  background: var(--accent); color: var(--sur-accent);
  display: flex; align-items: center; justify-content: center;
  font: 600 13px "Fredoka", sans-serif; transition: background-color .5s;
}
.bientot .num { background: transparent; border: 2px dashed var(--encre); }
.textes { flex-grow: 1; display: flex; flex-direction: column; gap: 2px; }
.textes strong { font: 600 17px "Fredoka", sans-serif; }
.textes span { font-size: 13px; opacity: .8; }

/* petit « boing » des cartes au changement de parfum */
.boing .lien { animation: boing .5s ease both; }
@keyframes boing {
  30% { transform: scale(1.04, .94); } 60% { transform: scale(.97, 1.03); } 100% { transform: none; }
}

footer { margin-top: 18px; font: 500 12px "Fredoka", sans-serif; letter-spacing: 2px; opacity: .85; text-align: center; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

<body data-parfum="fraise">
  <div class="bandeau" aria-hidden="true">
    <div class="defile">
      <span>FRAISE ✦ VANILLE ✦ CHOCOLAT ✦ JAVASCRIPT ✦ PYTHON ✦ CHANTILLY ✦ WINDEV ✦</span>
      <span>FRAISE ✦ VANILLE ✦ CHOCOLAT ✦ JAVASCRIPT ✦ PYTHON ✦ CHANTILLY ✦ WINDEV ✦</span>
    </div>
  </div>

  <main>
    <button class="switch" id="switch" type="button" role="switch" aria-checked="false" aria-label="Parfum vanille">
      <span class="boule" aria-hidden="true"></span>
      <span class="label">FRAISE</span>
      <span class="label">VANILLE</span>
      <span class="pepites" aria-hidden="true"></span>
    </button>

    <div class="avatar">
      <div class="avatar-inner">
        <div class="face" data-face="fraise"></div>
        <div class="face dos" data-face="vanille"></div>
      </div>
    </div>

    <h1 class="titre-font" id="nom"></h1>
    <p class="accroche" id="accroche"></p>
    <div class="pastille">PARFUM DU JOUR : <span id="parfum-nom">FRAISE</span></div>

    <nav id="liens" aria-label="Mes liens"></nav>

    <footer>SUCRE 100 % · TOTAL ∞ · SANS DATE LIMITE</footer>
  </main>

<script>
(function () {
  const PARFUMS = ["fraise", "vanille"];
  const COULEURS_PEPITES = ["#FF8FA6", "#F4C95D", "#9FE2C5", "#8FC7FF", "#4A2230"];
  const CORNET = '<svg width="56" height="56" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 22a10 10 0 0 1 20 0"/><path d="M12 22h24"/><path d="M14 22l10 22 10-22"/><path d="M19 30l9-4M21 36l7-3"/><circle cx="24" cy="9" r="3"/></svg>';

  // Textes
  document.getElementById("nom").textContent = CONFIG.nom;
  document.getElementById("accroche").textContent = CONFIG.accroche;
  document.title = CONFIG.nom + " — liens";

  // Photos (cornet si l'image ne charge pas)
  document.querySelectorAll(".face").forEach(function (face) {
    const p = CONFIG.photos[face.dataset.face];
    face.innerHTML = CORNET;
    if (p && p.src) {
      const img = new Image();
      img.alt = p.alt || "";
      img.onerror = function () { img.remove(); };
      img.src = p.src;
      face.appendChild(img);
    }
  });

  // Liens
  const nav = document.getElementById("liens");
  CONFIG.liens.forEach(function (l, i) {
    const el = document.createElement(l.url ? "a" : "div");
    el.className = "lien" + (l.url ? "" : " bientot");
    if (l.url) {
      el.href = l.url;
      if (/^https?:/.test(l.url)) { el.target = "_blank"; el.rel = "noopener"; }
    }
    const num = document.createElement("span");
    num.className = "num";
    num.textContent = "N°" + String(i + 1).padStart(2, "0");
    const textes = document.createElement("span");
    textes.className = "textes";
    const t = document.createElement("strong"); t.textContent = l.titre;
    const d = document.createElement("span");   d.textContent = l.description;
    textes.append(t, d);
    el.append(num, textes);
    if (l.url) el.insertAdjacentHTML("beforeend", '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>');
    nav.appendChild(el);
  });

  // Parfum : ?parfum=vanille dans l'URL > dernier choix > défaut
  function lireChoix() {
    const q = new URLSearchParams(location.search).get("parfum");
    if (PARFUMS.includes(q)) return q;
    try { const s = localStorage.getItem("parfum"); if (PARFUMS.includes(s)) return s; } catch (e) {}
    return PARFUMS.includes(CONFIG.parfumParDefaut) ? CONFIG.parfumParDefaut : "fraise";
  }

  const btn = document.getElementById("switch");
  function appliquer(parfum) {
    document.body.dataset.parfum = parfum;
    btn.setAttribute("aria-checked", parfum === "vanille" ? "true" : "false");
    document.getElementById("parfum-nom").textContent = parfum.toUpperCase();
    document.querySelector('meta[name="theme-color"]').content = parfum === "vanille" ? "#F4C95D" : "#FF8FA6";
  }

  function pepites() {
    const zone = btn.querySelector(".pepites");
    for (let i = 0; i < 14; i++) {
      const p = document.createElement("span");
      const angle = Math.random() * Math.PI * 2, dist = 40 + Math.random() * 40;
      p.className = "pepite";
      p.style.background = COULEURS_PEPITES[i % COULEURS_PEPITES.length];
      p.style.setProperty("--dx", Math.cos(angle) * dist + "px");
      p.style.setProperty("--dy", Math.sin(angle) * dist + "px");
      p.style.setProperty("--r", Math.round(Math.random() * 360) + "deg");
      zone.appendChild(p);
      setTimeout(function () { p.remove(); }, 750);
    }
  }

  btn.addEventListener("click", function () {
    const suivant = document.body.dataset.parfum === "fraise" ? "vanille" : "fraise";
    appliquer(suivant);
    try { localStorage.setItem("parfum", suivant); } catch (e) {}
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
      pepites();
      nav.classList.remove("boing"); void nav.offsetWidth; nav.classList.add("boing");
    }
  });

  appliquer(lireChoix());
})();
</script>
</body>
</html>
